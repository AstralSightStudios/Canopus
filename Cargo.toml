[workspace]
resolver = "2"
members = [
    "cli/canopus",
    "tools/canopus-core",
    "tools/elf-verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
jsonschema = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
