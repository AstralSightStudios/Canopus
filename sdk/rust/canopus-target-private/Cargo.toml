[package]
name = "canopus-target-private"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"
description = "Target-selectable private full-trust firmware bindings"

[features]
default = ["target-xiaomi-band-10-pro-3-101-030"]
target-xiaomi-band-10-pro-3-101-030 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-pro-3-101-030"]
target-xiaomi-band-10-pro-3-101-036 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-pro-3-101-036"]
target-xiaomi-band-9-pro-3-1-175 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-9-pro-3-1-175"]
target-xiaomi-band-11-4-100-108 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-11-4-100-108"]
target-xiaomi-band-10-pro-3-101-043 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-pro-3-101-043"]

[dependencies]
canopus-target-generated = { path = "../canopus-target-generated", optional = true, default-features = false }
