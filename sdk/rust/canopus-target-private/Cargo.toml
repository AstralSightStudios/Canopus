[package]
name = "canopus-target-private"
publish = false
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"
description = "Target-selectable private full-trust firmware bindings"

[features]
default = ["target-xiaomi-band-10-pro-3-101-036"]
target-xiaomi-band-10-pro-3-101-036 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-pro-3-101-036"]
target-xiaomi-band-10-pro-3-101-043 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-pro-3-101-043"]
target-xiaomi-band-11-4-100-139 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-11-4-100-139"]
target-xiaomi-band-11-4-100-155 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-11-4-100-155"]
target-xiaomi-band-11-4-100-179 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-11-4-100-179"]


[dependencies]
canopus-target-generated = { path = "../canopus-target-generated", optional = true, default-features = false }
