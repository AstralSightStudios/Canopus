[package]
name = "no-heap-counter"
description = "Canopus no-heap removable Rust example module (CAN-RUST-007) — host-testable rlib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "no_heap_counter"
crate-type = ["rlib"]

# The `device` feature pulls in the generated per-target bindings and the
# firmware identity guard. It is enabled only for the device package's
# cross-build; host tests run without it (no firmware addresses on the host).
[features]
default = []
device = ["dep:canopus-target-generated"]

[dependencies]
canopus-abi = { workspace = true }
canopus-runtime = { workspace = true }
canopus-target-generated = { path = "../../canopus-target-generated", optional = true }

[dev-dependencies]
canopus-host-fake = { path = "../../canopus-host-fake" }
