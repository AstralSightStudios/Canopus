[workspace]
resolver = "2"
members = [
    "canopus-abi",
    "canopus-runtime",
    "canopus-host-fake",
    "canopus-target-generated",
    "examples/no-heap-counter",
    "examples/no-heap-counter-device",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
canopus-abi = { path = "canopus-abi" }
canopus-runtime = { path = "canopus-runtime" }

# Device modules are linked for the target with panic=abort (no unwind,
# architecture §12.1).
[profile.release]
panic = "abort"
opt-level = "z"
lto = "thin"
codegen-units = 1

# The no_std device staticlib is a workspace member, so a plain host
# `cargo build` compiles it too. panic=abort makes that host build valid
# (no_std cannot unwind). Host tests use assertions only (no #[should_panic]),
# so the test harness works unchanged.
[profile.dev]
panic = "abort"
