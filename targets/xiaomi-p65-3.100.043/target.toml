# Candidate stock NuttX module-loader profile. Static analysis recovers the
# ET_REL e_entry and +104/+108 unload-pair ABI. The target-aware C scaffold now
# emits a host-verified module_initialize shim, but the P65 Supervisor build
# case/backend, API imports and device behavior remain unverified; keep this
# profile non-deployable. The relocation allowlist below mirrors the exact AP
# modlib switch and is a static verifier bound, not a device-validated policy.
[loader_profile]
elf_class = 32
elf_machine = "ARM"
elf_type = "ET_REL"
endianness = "little"
constructor_discovery = "module_initialize"
symbol_imports = "none"
max_size = 0
alignment = 4
module_name_rules = "candidate only; exact NSH argument validation not audited"
load_command = "insmod <path> <name>"
unload_command = "rmmod <name>"
persistent_autoload = false

