# Shared build and generation data for REDMI Watch 6 (p65) targets.
# LVGL v9 Manager backend with the shared UI host; the loader uses the generic
# staged path (explicit MPU lease through the BES driver) rather than the
# Band 11 bootstrap helpers.
manager_backend = "manager/target/canopus_manager_target.c"
supervisor_max_size = 133120
supervisor_max_resident = 184320
loader_sources = [
  "runtime/loader/canopus_arm_reloc.c",
  "runtime/loader/canopus_elf32_loader.c",
]
# The Manager target and the shared UI host select the MIwear lvx widget layer
# (and include canopus_band11_addresses.h) under this define, exactly as the
# Band 11 family does.
defines = ["-DCANOPUS_MGR_BAND11=1", "-DCANOPUS_MGR_REDMI_WATCH=1"]
prod_family = "redmi-watch"
private_symbols = false
# Emit canopus_band11_addresses.h from loader/native-bindings.json: the v9 UI
# host needs the MIwear lvx_*/FW_UI_* macro set that the FW_9 config does not
# carry.
native_config = true
