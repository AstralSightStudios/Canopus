# Firmware absolute-address space (CAN-P1-011). This is the RECOVERED
# firmware extent, not the full 16 MB addressable window: every recovered
# entry/callable address (identity strings 0x0C0C0810 .. launcher app symbols
# 0x0C4F3389) lives below 0x0C50_0000. Data constants a module may embed
# (float bit patterns, masks) can fall anywhere in the window, so scanning the
# whole window would flag non-addresses; this range is the extent we have
# actually recovered and must be widened as recovery grows (bumping the pack
# revision). The ELF verifier flags module words in this range that are not in
# the approved address allowlist.
firmware_address_ranges = [
  { base = 0x0C000000, size = 0x00500000 },
]

# Capabilities proven on this exact firmware. Public generated bindings remain
# restricted; full-trust Bluetooth/native-app consumers select the target-private
# Rust backend and must pass the identity guard before invoking them.
capabilities = [
  "identity-guard",
  "clock.gettime",
  "char-device.register",
  "char-device.unregister",
  "control-abi",
  "classic.adapter",
  "classic.l2cap",
  "classic.hci-receive-hook",
  "classic.sdp",
  "bt.timer",
  "native-app.register",
  "launcher.entry",
