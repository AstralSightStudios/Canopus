name: ci

# Canopus host gate pipeline (CAN-REL-002). Runs every host-verifiable gate on
# every push/PR; device gates (G0-G7) are hardware-in-loop and intentionally
# not part of CI (see docs/architecture.md §20.3).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install lld (for ARM relocatable linking)
        run: brew install lld

      - name: Run all host gates
        run: ./scripts/ci.sh

  linux:
    # `canopus` on Linux: the CLI tests, then every template built, verified and
    # loaded on every active target (gate 5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabi

      - name: Install LLVM (clang, ld.lld, llvm-ar)
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: CLI tests
        run: cargo test -p canopus-cli

      - name: Templates and Rust modules
        run: cargo build -p canopus-cli && target/debug/canopus doctor && CANOPUS_CI_ONLY=gate_5 sh scripts/ci.sh
